name: Independent w3strings spike
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  independent-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Recreate original fixtures and independently read Go roundtrip
        run: docker build --progress=plain -f ci/w3strings-spike.Dockerfile .
