name: Linux publication probe
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  non-root-filesystems:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build pinned CGO-free toolchain image
        run: docker build --progress=plain -t yakuori-publication-probe -f ci/Dockerfile .
      - name: Non-root host filesystem and separate-mount probes
        run: |
          mkdir -p "$RUNNER_TEMP/publication" "$RUNNER_TEMP/publication/tmp" \
            "$RUNNER_TEMP/publication/cache" "$RUNNER_TEMP/publication/gopath" \
            "$RUNNER_TEMP/publication/pipeline-evidence"
          findmnt -T "$RUNNER_TEMP/publication" -o TARGET,FSTYPE,OPTIONS
          findmnt -T "$RUNNER_TEMP/publication/tmp" -o TARGET,FSTYPE,OPTIONS
          test -w "$RUNNER_TEMP/publication/tmp"
          docker run --rm --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,mode=1777 \
            -v "$PWD:/src" -v "$RUNNER_TEMP/publication:/evidence" \
            -e GOCACHE=/evidence/cache -e GOPATH=/evidence/gopath \
            -e TMPDIR=/evidence/tmp -e GOTMPDIR=/evidence/tmp \
            -e YAKUORI_PIPELINE_EVIDENCE=/evidence/pipeline-evidence \
            yakuori-publication-probe sh -ec '
              test "$(id -u)" != 0
              uname -sr
              go version
              stat -f -c "host filesystem: %T %t" /evidence
              test "$(stat -f -c %t /evidence)" = ef53
              test -w /evidence/tmp
              test -w "$YAKUORI_PIPELINE_EVIDENCE"
              echo "qualified TMPDIR=$(stat -f -c %T /evidence/tmp) GOTMPDIR=/evidence/tmp"

              mkdir -p /evidence/names
              printf "%s\n" "TestPipelineFaultBridge/close-error" "TestPipelineFaultBridge/delegates" > /evidence/names/bridge
              printf "%s\n" "TestPipelineFixtureInputs/reject-authored-mismatch/text" "TestPipelineFixtureInputs/reject-authored-mismatch/w3" "TestPipelineFixtureInputs/valid/text" "TestPipelineFixtureInputs/valid/w3" > /evidence/names/fixture-inputs
              printf "%s\n" "TestPipelineFixture/invalid-candidate/text" "TestPipelineFixture/invalid-candidate/w3" "TestPipelineFixture/repeat/stdout-text" "TestPipelineFixture/repeat/text" "TestPipelineFixture/repeat/w3" "TestPipelineFixture/rerun/create-refuses-existing" "TestPipelineFixture/rerun/replace-same-target" "TestPipelineFixture/rerun/text-in-place" "TestPipelineFixture/rerun/w3-in-place-ja-header" "TestPipelineFixture/stdout/text" "TestPipelineFixture/text/create" "TestPipelineFixture/text/in-place" "TestPipelineFixture/text/replace-absent" "TestPipelineFixture/text/replace-existing" "TestPipelineFixture/w3/create" "TestPipelineFixture/w3/in-place" "TestPipelineFixture/w3/replace-absent" "TestPipelineFixture/w3/replace-existing" > /evidence/names/fixture
              printf "%s\n" "TestPipelineHarnessBoundaries/reject-invalid-observation/missing-stage-write" "TestPipelineHarnessBoundaries/reject-invalid-observation/observe-after-before-commit" "TestPipelineHarnessBoundaries/reject-invalid-observation/publish-before-commit" "TestPipelineHarnessBoundaries/reject-invalid-observation/stdout-boundary-on-file" "TestPipelineHarnessBoundaries/valid/file-replace-existing/text" "TestPipelineHarnessBoundaries/valid/file-replace-existing/w3" "TestPipelineHarnessBoundaries/valid/stdout/text" > /evidence/names/boundaries
              printf "%s\n" "TestPipelineHarnessState/reject-invalid-observation/ambiguous-commit-is-unknown" "TestPipelineHarnessState/reject-invalid-observation/certainty-from-flag" "TestPipelineHarnessState/reject-invalid-observation/d0-wrong-row" "TestPipelineHarnessState/reject-invalid-observation/d1-wrong-row" "TestPipelineHarnessState/reject-invalid-observation/historical-precommit-rows-cannot-prove-rollback" "TestPipelineHarnessState/reject-invalid-observation/record-close-missing-with-prose-basis" "TestPipelineHarnessState/reject-invalid-observation/record-existing-output-hash" "TestPipelineHarnessState/reject-invalid-observation/record-installed-misread" "TestPipelineHarnessState/reject-invalid-observation/record-source-dev" "TestPipelineHarnessState/reject-invalid-observation/record-source-hash" "TestPipelineHarnessState/reject-invalid-observation/record-source-inode" "TestPipelineHarnessState/reject-invalid-observation/record-source-mode" "TestPipelineHarnessState/reject-invalid-observation/record-source-mount" "TestPipelineHarnessState/reject-invalid-observation/record-source-nlink" "TestPipelineHarnessState/reject-invalid-observation/record-source-path" "TestPipelineHarnessState/reject-invalid-observation/record-source-size" "TestPipelineHarnessState/reject-invalid-observation/record-stage-hash" "TestPipelineHarnessState/reject-invalid-observation/record-stage-inode" "TestPipelineHarnessState/reject-invalid-observation/record-stage-mode" "TestPipelineHarnessState/reject-invalid-observation/record-stage-mount" "TestPipelineHarnessState/reject-invalid-observation/record-stage-nlink" "TestPipelineHarnessState/reject-invalid-observation/record-stage-size" "TestPipelineHarnessState/reject-invalid-observation/stage-missing" "TestPipelineHarnessState/valid/file-replace-existing/text" "TestPipelineHarnessState/valid/file-replace-existing/w3" "TestPipelineHarnessState/valid/stdout/text" > /evidence/names/state
              printf "%s\n" "TestPipelineHarnessBarrier" > /evidence/names/barrier
              printf "%s\n" "TestPipelineHarnessGuards/cleanup-rescue" "TestPipelineHarnessGuards/early-return" "TestPipelineHarnessGuards/healthy-positive-control" "TestPipelineHarnessGuards/malformed-input" "TestPipelineHarnessGuards/timeout-explicit-cancel" "TestPipelineHarnessGuards/uninjected" "TestPipelineHarnessGuards/unreached" "TestPipelineHarnessGuards/unreaped" "TestPipelineHarnessGuards/wrong-boundary" > /evidence/names/guards
              printf "%s\n" "TestPipelineHarnessFault/cleanup-rescue" "TestPipelineHarnessFault/normal-counterpart/text" "TestPipelineHarnessFault/normal-counterpart/w3" "TestPipelineHarnessFault/process/cancel/text" "TestPipelineHarnessFault/process/error/text" "TestPipelineHarnessFault/process/error/w3" "TestPipelineHarnessFault/stage-close/text" "TestPipelineHarnessFault/stage-close/w3" > /evidence/names/fault
              printf "%s\n" "TestPipelineHarnessCLI/localize-close-error" "TestPipelineHarnessCLI/localize-diagnostic-writer-error" "TestPipelineHarnessCLI/translate-text-stdout" > /evidence/names/cli
              # Freeze #69 terminal names from the accepted P/Q axes, never logs.
              for lane in contract inference segmented final cli signals; do
                : >"/evidence/names/precommit-$lane"
              done
              printf "%s\n" TestPipelinePrecommitContract/normal-controls \
                TestPipelinePrecommitContract/precommit-preserved \
                TestPipelinePrecommitContract/reject >> /evidence/names/precommit-contract
              for row in text w3 stdout; do
                printf "%s\n" "TestPipelinePrecommitContract/normal-controls/$row" >> /evidence/names/precommit-contract
              done
              for row in create replace-absent replace-existing in-place; do
                printf "%s\n" "TestPipelinePrecommitContract/precommit-preserved/$row" >> /evidence/names/precommit-contract
              done
              for row in d0 output-present backup-present source-identity phase cause exit rerun \
                extra-generate early-close unreached wrong-occurrence uninjected stage-order; do
                printf "%s\n" "TestPipelinePrecommitContract/reject/$row" >> /evidence/names/precommit-contract
              done
              for backend in cpu cuda; do
                for surface in text-file-replace-existing w3-file-replace-existing text-stdout-none; do
                  for row in happy builder-error builder-cancel count-error count-cancel \
                    effective-equal effective-plus-one policy-over-limit foreign-request \
                    partial-plus-error max-tokens context-limit timeout-finish canceled-finish \
                    decode-error invalid-output unknown-finish prompt-count-mismatch deadline \
                    cancel-after-stop core-deadline; do
                    printf "%s\n" "TestPipelinePrecommitInference/$backend-$surface-$row" >> /evidence/names/precommit-inference
                  done
                done
                for row in builder-error builder-cancel count-error count-cancel effective-plus-one; do
                  for prefix in later all-hit-later; do
                    printf "%s\n" "TestPipelinePrecommitInference/$backend-w3-file-replace-existing-$prefix-$row" >> /evidence/names/precommit-inference
                  done
                done
                for row in multiunit-first multiunit-middle multiunit-last multiunit-hit-middle; do
                  printf "%s\n" "TestPipelinePrecommitInference/$backend-w3-file-replace-existing-$row" >> /evidence/names/precommit-inference
                done
                for kind in text w3; do
                  for mode in create replace-absent inplace; do
                    for row in builder-error partial-plus-error; do
                      printf "%s\n" "TestPipelinePrecommitInference/$backend-$kind-file-$mode-$row" >> /evidence/names/precommit-inference
                    done
                  done
                done
                for surface in file-replace-existing stdout-none; do
                  for row in happy all-admission second-partial second-max second-unknown \
                    second-decode second-count-mismatch second-cancel second-deadline \
                    protected-token-invalid parent-validation-invalid; do
                    printf "%s\n" "TestPipelinePrecommitSegmented/$backend-text-$surface-$row" >> /evidence/names/precommit-segmented
                  done
                done
                for mode in create replace-absent inplace; do
                  printf "%s\n" "TestPipelinePrecommitSegmented/$backend-text-file-$mode-second-partial" >> /evidence/names/precommit-segmented
                done
                for kind in text w3; do
                  for row in happy create-collision write-zero-error write-prefix-error sync-error \
                    close-error cancel-write cancel-sync cancel-close observe-read-error \
                    cancel-observe-read cancel-observe-after cancel-compare-after; do
                    printf "%s\n" "TestPipelinePrecommitFinal/$backend-$kind-file-replace-existing-$row" >> /evidence/names/precommit-final
                  done
                  for mode in create replace-absent inplace; do
                    for row in sync-error cancel-compare-after; do
                      printf "%s\n" "TestPipelinePrecommitFinal/$backend-$kind-file-$mode-$row" >> /evidence/names/precommit-final
                    done
                  done
                done
                for row in happy observe-read-error cancel-observe-read cancel-observe-after; do
                  printf "%s\n" "TestPipelinePrecommitFinal/$backend-text-stdout-none-$row" >> /evidence/names/precommit-final
                done
                for row in missing-empty-id duplicate-id unknown-id foreign-artifact-bytes \
                  string-order-only key-order-only key-reassigned foreign-session-manifest foreign-artifact-manifest; do
                  printf "%s\n" "TestPipelinePrecommitFinal/$backend-w3-file-replace-existing-$row" >> /evidence/names/precommit-final
                done
                backend_rows=
                if [ "$backend" = cuda ]; then
                  backend_rows="unsupported residency-vram-decline"
                fi
                for surface in text-file-replace-existing text-stdout-none w3-file-replace-existing; do
                  for row in happy open-error info-error profile-request-error body-request-error \
                    count-error partial-plus-error open-cancel info-cancel profile-request-cancel \
                    model-unselected model-missing model-mismatch $backend_rows; do
                    for entry in dispatch execute-cause; do
                      printf "%s\n" "TestPipelinePrecommitCLI/$backend-$surface-$row-$entry" >> /evidence/names/precommit-cli
                    done
                  done
                done
                for surface in text-translate-stdout text-file-replace-existing w3-file-replace-existing; do
                  for row in sigint sigterm context-cancel caller-deadline request-deadline; do
                    printf "%s\n" "TestPipelinePrecommitSignals/$backend-$surface-$row" >> /evidence/names/precommit-signals
                  done
                done
                for kind in text w3; do
                  for mode in create replace-absent in-place; do
                    printf "%s\n" "TestPipelinePrecommitSignals/$backend-$kind-file-$mode-sigterm" >> /evidence/names/precommit-signals
                  done
                done
              done
              for row in early-close-negative rescue-negative; do
                printf "%s\n" "TestPipelinePrecommitSignals/$row" >> /evidence/names/precommit-signals
              done
              printf "%s\n" TestPipelineUnsupportedFilesystem > /evidence/names/precommit-refusal

              require_names() {
                label=$1
                names=$2
                test_log=$3
                pass_names=/evidence/names/"$label".pass
                run_names=/evidence/names/"$label".run
                observed=/evidence/names/"$label".observed
                allowed=/evidence/names/"$label".allowed
                roots=/evidence/names/"$label".roots
                bad=0
                if grep -Eq "^[[:space:]]*--- (FAIL|SKIP)" "$test_log"; then
                  echo "required lane reported FAIL or SKIP" >&2
                  return 1
                fi
                grep -E "^[[:space:]]*--- PASS: " "$test_log" \
                  | sed -E "s/^[[:space:]]*--- PASS: //; s/ [(].*//" | sort >"$pass_names"
                if [ ! -s "$pass_names" ]; then
                  echo "required lane $label selected no PASS output" >&2
                  return 1
                fi
                if [ -n "$(uniq -d "$pass_names")" ]; then
                  echo "required lane $label duplicated a PASS name" >&2
                  return 1
                fi
                grep -E "^[[:space:]]*=== RUN   " "$test_log" \
                  | sed -E "s/^[[:space:]]*=== RUN   //" | sort >"$run_names"
                if [ -n "$(uniq -d "$run_names")" ]; then
                  echo "required lane $label duplicated a RUN name" >&2
                  return 1
                fi
                : >"$allowed"
                : >"$roots"
                while IFS= read -r name; do
                  [ -n "$name" ] || continue
                  runs=$(grep -Ec "^[[:space:]]*=== RUN   $name[[:space:]]*$" "$test_log" || true)
                  passes=$(grep -Ec "^[[:space:]]*--- PASS: $name[[:space:]]*[(]" "$test_log" || true)
                  if [ "$runs" -ne 1 ] || [ "$passes" -ne 1 ]; then
                    echo "required lane $label terminal $name RUN=$runs PASS=$passes, want 1/1" >&2
                    bad=1
                  fi
                  root=${name%%/*}
                  if ! grep -Fqx "$root" "$roots"; then
                    printf "%s\n" "$root" >>"$roots"
                    root_runs=$(grep -Ec "^[[:space:]]*=== RUN   $root[[:space:]]*$" "$test_log" || true)
                    root_passes=$(grep -Ec "^[[:space:]]*--- PASS: $root[[:space:]]*[(]" "$test_log" || true)
                    if [ "$root_runs" -ne 1 ] || [ "$root_passes" -ne 1 ]; then
                      echo "required lane $label root $root RUN=$root_runs PASS=$root_passes, want 1/1" >&2
                      bad=1
                    fi
                  fi
                  printf "%s\n" "$name" >>"$allowed"
                  prefix=$name
                  while :; do
                    case $prefix in
                    */*) prefix=${prefix%/*} ;;
                    *) break ;;
                    esac
                    printf "%s\n" "$prefix" >>"$allowed"
                  done
                done <"$names"
                { cat "$run_names"; cat "$pass_names"; } | sort -u >"$observed"
                while IFS= read -r name; do
                  [ -n "$name" ] || continue
                  grep -Fqx "$name" "$allowed" || {
                    echo "required lane $label unexpected terminal $name" >&2
                    bad=1
                  }
                  runs=$(grep -Ec "^[[:space:]]*=== RUN   $name[[:space:]]*$" "$test_log" || true)
                  passes=$(grep -Ec "^[[:space:]]*--- PASS: $name[[:space:]]*[(]" "$test_log" || true)
                  if [ "$runs" -ne 1 ] || [ "$passes" -ne 1 ]; then
                    echo "required lane $label incomplete terminal $name RUN=$runs PASS=$passes, want 1/1" >&2
                    bad=1
                  fi
                done <"$observed"
                [ "$bad" -eq 0 ]
              }

              run_required() {
                label=$1
                names=$2
                shift 2
                log=/evidence/"$label".log
                if ! "$@" >"$log" 2>&1; then
                  cat "$log"
                  return 1
                fi
                cat "$log"
                require_names "$label" "$names" "$log"
              }

              run_required bridge /evidence/names/bridge \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/publication -run "^TestPipelineFaultBridge$" -v
              run_required fixture-inputs /evidence/names/fixture-inputs \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/localize -run "^TestPipelineFixtureInputs$" -v
              run_required fixture /evidence/names/fixture \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/localize -run "^TestPipelineFixture$" -v
              run_required boundaries /evidence/names/boundaries \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/localize -run "^TestPipelineHarnessBoundaries$" -v
              run_required state /evidence/names/state \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/localize -run "^TestPipelineHarnessState$" -v
              run_required barrier /evidence/names/barrier \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/localize -run "^TestPipelineHarnessBarrier$" -v
              run_required guards /evidence/names/guards \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/localize -run "^TestPipelineHarnessGuards$" -v
              run_required fault /evidence/names/fault \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/localize -run "^TestPipelineHarnessFault$" -v
              run_required cli /evidence/names/cli \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/cli -run "^TestPipelineHarnessCLI$" -v
              # Each new root is required separately; the signal child is not a lane.
              run_required precommit-contract /evidence/names/precommit-contract \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/localize -run "^TestPipelinePrecommitContract$" -v
              run_required precommit-inference /evidence/names/precommit-inference \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/localize -run "^TestPipelinePrecommitInference$" -v
              run_required precommit-segmented /evidence/names/precommit-segmented \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/localize -run "^TestPipelinePrecommitSegmented$" -v
              run_required precommit-final /evidence/names/precommit-final \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/localize -run "^TestPipelinePrecommitFinal$" -v
              run_required precommit-cli /evidence/names/precommit-cli \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/cli -run "^TestPipelinePrecommitCLI$" -v
              YAKUORI_SIGNAL_STATE=/evidence/pipeline-evidence/precommit-signals-state.json \
                run_required precommit-signals /evidence/names/precommit-signals \
                go test -count=1 -timeout 10m -tags pipelinefaults ./internal/cli -run "^TestPipelinePrecommitSignals$" -v

              test "$(stat -f -c %T /tmp)" = tmpfs
              echo "unsupported-filesystem lane: TMPDIR=/tmp GOTMPDIR=/tmp filesystem=tmpfs"
              TMPDIR=/tmp GOTMPDIR=/tmp run_required precommit-refusal /evidence/names/precommit-refusal \
                go test -count=1 -timeout 180s -tags pipelinefaults ./internal/localize -run "^TestPipelineUnsupportedFilesystem$" -v
              if TMPDIR=/tmp GOTMPDIR=/tmp \
                YAKUORI_PIPELINE_EVIDENCE="$YAKUORI_PIPELINE_EVIDENCE/unsupported-positive" \
                go test -count=1 -timeout 180s -tags pipelinefaults \
                ./internal/localize -run "^TestPipelinePrecommitFinal$/^cpu-text-file-replace-existing-happy$" -v \
                > /evidence/precommit-expected-red.log 2>&1; then
                cat /evidence/precommit-expected-red.log
                echo "qualified positive unexpectedly passed on tmpfs" >&2
                exit 1
              else
                expected_red_exit=$?
              fi
              cat /evidence/precommit-expected-red.log
              grep -Fq "error=localize prepare failed unsupported_filesystem=true" /evidence/precommit-expected-red.log
              if grep -Eq "^[[:space:]]*--- (PASS|SKIP)" /evidence/precommit-expected-red.log; then
                echo "tmpfs positive reported PASS or SKIP" >&2
                exit 1
              fi
              echo "pipeline expected RED: exit=$expected_red_exit; typed prepare refusal; later fault stages not-run; not a fault PASS"
              find "$YAKUORI_PIPELINE_EVIDENCE" -type f -printf "%p %s bytes\n" | sort

              TMPDIR=/evidence go test -count=1 -v ./research/publication
              TMPDIR=/tmp GOTMPDIR=/tmp go test -count=1 -v ./research/publication
              TMPDIR=/evidence go test -count=1 -v ./internal/publication ./internal/artifact ./internal/cli
              TMPDIR=/tmp GOTMPDIR=/tmp go test -count=1 -v ./internal/publication -run "^TestUnsupportedFilesystem$"
              test -z "$(gofmt -l research/publication)"
              go vet ./research/publication
              go vet ./internal/publication
              GOOS=linux GOARCH=arm64 go test -c -o /evidence/publication-arm64.test ./research/publication
              GOOS=linux GOARCH=arm64 go test -c -o /evidence/product-publication-arm64.test ./internal/publication
            '
