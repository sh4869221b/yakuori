name: CPU inference spike
on:
  pull_request:
    paths:
      - 'tools/cpuspike/**'
      - 'internal/inference/**'
      - 'internal/prompt/**'
      - 'internal/localize/**'
      - 'internal/segment/**'
      - 'internal/protect/**'
      - 'internal/validate/**'
      - 'internal/adapter/**'
      - 'internal/artifact/**'
      - 'internal/cli/**'
      - 'internal/config/**'
      - 'internal/glossary/**'
      - 'internal/identity/**'
      - 'internal/models/**'
      - 'internal/publication/**'
      - 'internal/tm/**'
      - 'internal/unit/**'
      - 'tools/acceptance/testdata/small.w3strings'
      - 'ci/verify.sh'
      - 'ci/cpu-spike.Dockerfile'
      - 'ci/run-long-context.py'
      - 'ci/test-long-context-supervisor.py'
      - '.github/workflows/cpu-spike.yml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-cpu-gguf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build without native compiler and acquire checksum-pinned test fixture
        run: docker build --progress=plain -f ci/cpu-spike.Dockerfile -t yakuori-cpu-spike .
      - name: Real CPU generation and failure semantics without network
        run: docker run --rm --network none --memory 4g --cpus 2 yakuori-cpu-spike
      - name: Production CPU wrapper smoke without network
        run: |
          docker run --rm --network none --memory 4g --memory-swap 4g --cpus 2 \
            -e YAKUORI_CPU_MODEL=/model.gguf --entrypoint /cpu-wrapper-smoke.test \
            yakuori-cpu-spike -test.run '^TestCPUWrapperSmoke$' -test.v -test.timeout 180s
      - name: Production W3 CPU regression without network
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/w3-cpu/tmp"
          findmnt -T "$RUNNER_TEMP/w3-cpu/tmp" -o TARGET,FSTYPE,OPTIONS
          case "$(stat -f -c %t "$RUNNER_TEMP/w3-cpu/tmp")" in
            ef53|9123683e) ;;
            *) echo 'W3 CPU regression requires ext4/Btrfs' >&2; exit 1 ;;
          esac
          docker run --rm --init --network none --memory 4g --memory-swap 4g --cpus 2 \
            --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/w3-cpu:/evidence" \
            -e TMPDIR=/evidence/tmp -e GOTMPDIR=/evidence/tmp -e YAKUORI_CPU_MODEL=/model.gguf \
            -w /src/internal/cli --entrypoint /w3-cpu-smoke.test yakuori-cpu-spike \
            -test.run '^TestW3CPURegression$' -test.v -test.timeout 5m | tee "$RUNNER_TEMP/w3-cpu/result.log"
          grep -Fq '=== RUN   TestW3CPURegression' "$RUNNER_TEMP/w3-cpu/result.log"
          grep -Fq -- '--- PASS: TestW3CPURegression ' "$RUNNER_TEMP/w3-cpu/result.log"
      - name: Bounded 1K and 4K token-counted CPU experiment
        run: |
          mkdir -p long-context-results
          docker run --rm --network none --memory 4g --memory-swap 4g --cpus 2 \
            -v "$PWD/long-context-results:/evidence" --entrypoint python3 \
            yakuori-cpu-spike /src/ci/run-long-context.py /cpuspike /model.gguf \
            /evidence --stages 1024,4096
      - name: Show bounded long-context evidence even on failure
        if: always()
        run: |
          for file in long-context-results/*; do
            [ -f "$file" ] || continue
            echo "=== $file ==="
            cat "$file"
          done
