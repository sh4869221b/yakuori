name: OpenAI CLI smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    environment: api key
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify and build fixed source
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 496b59bdc43984f4dc16ddca51971ed0b43a8df3
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ci.yml
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/toolchain"
          git archive 496b59bdc43984f4dc16ddca51971ed0b43a8df3 | tar -x -C "$RUNNER_TEMP/source"
          curl -fsSL https://go.dev/dl/go1.27.3.linux-amd64.tar.gz -o "$RUNNER_TEMP/go.tar.gz"
          echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  $RUNNER_TEMP/go.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP/toolchain"
          cd "$RUNNER_TEMP/source"
          CGO_ENABLED=0 GOTOOLCHAIN=local "$RUNNER_TEMP/toolchain/go/bin/go" build -o "$RUNNER_TEMP/yakuori" ./cmd/yakuori
      - name: Run CLI once
        env:
          OPENAI_API_KEY: ${{ secrets.APIKEY }}
        run: |
          set -eu
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg" XDG_DATA_HOME="$RUNNER_TEMP/xdg" XDG_CACHE_HOME="$RUNNER_TEMP/xdg" XDG_STATE_HOME="$RUNNER_TEMP/xdg"
          mkdir -p "$RUNNER_TEMP/xdg/yakuori"
          printf 'Hello, traveler.' > "$RUNNER_TEMP/input.txt"
          set +e
          "$RUNNER_TEMP/yakuori" translate --source-language en --target-language ja --game smoke --artifact smoke --backend openai --openai-model gpt-5.4-mini-2026-03-17 "$RUNNER_TEMP/input.txt" > "$RUNNER_TEMP/result.txt" 2> "$RUNNER_TEMP/diagnostic.txt"
          status=$?
          set -e
          printf 'CLI_EXIT=%s\n' "$status"
          if [ "$status" -eq 0 ]; then
            printf 'TRANSLATION_BEGIN\n'
            cat "$RUNNER_TEMP/result.txt"
            printf '\nTRANSLATION_END\n'
          else
            printf 'CLI failed; diagnostic withheld\n'
          fi
          exit "$status"
