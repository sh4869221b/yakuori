name: Go foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux-cgo-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Clean Linux amd64 build, test, vet and Linux arm64 cross-build
        run: docker build --progress=plain -f ci/Dockerfile .
