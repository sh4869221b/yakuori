name: OpenAI bounded smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    environment: api key
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source and prepare
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 496b59bdc43984f4dc16ddca51971ed0b43a8df3
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$(printf '%s\n' .github/workflows/ci.yml smoke/openai/main.go | sort)"
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/source/smoke/openai" "$RUNNER_TEMP/toolchain"
          git archive 496b59bdc43984f4dc16ddca51971ed0b43a8df3 | tar -x -C "$RUNNER_TEMP/source"
          cp smoke/openai/main.go "$RUNNER_TEMP/source/smoke/openai/main.go"
          curl -fsSL https://go.dev/dl/go1.27.3.linux-amd64.tar.gz -o "$RUNNER_TEMP/go.tar.gz"
          echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  $RUNNER_TEMP/go.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP/toolchain"
          cd "$RUNNER_TEMP/source"
          CGO_ENABLED=0 GOTOOLCHAIN=local "$RUNNER_TEMP/toolchain/go/bin/go" build -o "$RUNNER_TEMP/openai-smoke" ./smoke/openai
      - name: Run bounded smoke
        env:
          OPENAI_API_KEY: ${{ secrets.APIKEY }}
        run: '"$RUNNER_TEMP/openai-smoke"'
